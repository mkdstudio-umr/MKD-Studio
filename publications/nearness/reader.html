*, *::before, *::after {

/* ── PAGES ──────────────────────────────── */

.page {
  width: 100%; height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: var(--linen);

}

.page::before {

/* ── MOBILE LAYOUT ─────────────────────── */
#mobile-wrap { position: fixed; inset: 0; }

.pg-enter-right { animation: pgInRight .46s cubic-bezier(.7,0,.2,1) both; }

.pg-exit-left   { animation: pgOutLeft .46s cubic-bezier(.7,0,.2,1) both; }

@keyframes pgInLeft   { from{transform:translateX(-100%)} to{transform:translateX(0)} }

  #counter { bottom: 1.8rem; left: auto; right: 3.5vw; transform: none; }

  #btn-prev, #btn-next {
    position: fixed; top: 50%; transform: translateY(-50%);
    z-index: 40; background: none; border: none; cursor: pointer;
    color: rgba(176,171,166,.4); font-family: inherit;

  #btn-next { right: .4vw; }
  #btn-prev:hover, #btn-next:hover { color: rgba(176,171,166,.85); }
}

@media (prefers-reduced-motion: reduce) {
  .pg-enter-right, .pg-enter-left,
  .pg-exit-left, .pg-exit-right { animation: none; }

const PAGES = [

`<section class="page dark-page">

/* 04 */
`<section class="page">
  <div class="textwrap">
    <div class="section-label">Introduction</div>
    <p class="body">Every other publication in this catalogue documents a place that can be visited. This one does not. Makkah and Madinah are not destinations in the ordinary sense: nobody passes through, nobody stumbles across them, and nobody arrives without having intended to for a long time, sometimes a whole life.</p>
    <p class="body">The camera is an awkward companion on a journey like this. It wants to stand back, and the entire point of being here is nearness: to the Kaaba, to the mosque of the Prophet &#65018;, to the millions who have stood on the same marble before you and the millions who will after. The most important moments of the journey have no photographs in this book, because they have no photographs at all. Where that is the case, the writing goes where the camera could not, and says only what was seen and what the tradition itself says.</p>
    <p class="body">This book is arranged as the journey is arranged: Makkah first, with its weight; then the road between, which carries more history than any road on earth; then Madinah, with its rest. What the photographs surround, each reader will know or will not, and no caption can change which.</p>

/* 06 */
`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">I &nbsp;&middot;&nbsp; The Intention</div>
    <hr class="text-rule">
    <p class="body">The journey begins at home, before any suitcase is opened, with a sentence said quietly and meant. The tradition calls it niyyah: the intention, formed in the heart, that separates travel from pilgrimage. Two people can sit in the same seat on the same aeroplane and be on entirely different journeys, and the difference between them is one silent sentence.</p>
    <p class="body">For most of history the intention had to carry further than it does now. Pilgrims from the far ends of the world walked for months or years. Many wrote their wills before leaving, because return was not assumed. The caravan routes from Damascus, Cairo and Baghdad were institutions in their own right, with wells and forts built along them by rulers who understood that easing this journey was the most permanent thing they would ever do. The aeroplane has shortened the distance. Those who make the journey say the intention still has to travel the whole way.</p>
    <p class="body">Somewhere over the sea, an announcement is made that the aircraft is approaching the boundary the tradition calls the miqat, the point past which no pilgrim may pass without being ready. The cabin, until now an ordinary cabin, begins to change.</p>
  </div>
</section>`,

/* 07 */
`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">I &nbsp;&middot;&nbsp; The White Cloth</div>
    <hr class="text-rule">
    <p class="body">The men return from the aircraft toilets two at a time, transformed: two lengths of unstitched white cloth, one at the waist, one over the shoulder. The state is called ihram, which means prohibition. No perfume. No argument. No cutting of hair or nails. No harm to any living thing, down to the insects. A king in ihram is indistinguishable from anyone else, and the tradition is clear that this is the entire point.</p>
    <p class="body">Then the words begin. Labbayk Allahumma labbayk: here I am, O God, here I am. It is called the talbiyah, and it is the answer to an invitation the tradition traces back to Ibrahim, peace be upon him, who was commanded to call mankind to this House and wondered aloud how his voice could reach them. Every pilgrim who says these words understands themselves to be answering that call, at whatever distance of geography and centuries.</p>
    <p class="body">Heard from inside an aircraft cabin, several hundred voices saying it softly and not quite together, it is one of the most extraordinary sounds a traveller will ever hear in economy class. Nobody conducts it. It rises and settles on its own, the whole descent long, until the wheels touch.</p>
  </div>
</section>`,

</section>`,

/* 10 */
`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">II &nbsp;&middot;&nbsp; Arrival</div>
    <hr class="text-rule">
    <p class="body">The first sight of the sanctuary usually arrives at an odd moment. Through a coach window in traffic. Between buildings. Or, as here, at three in the morning from an unlit hotel room: the mosque below, white and gold against the dark, still moving with people at an hour when every other city in the world has gone quiet. There is a supplication taught for this moment of first seeing, and pilgrims will tell you that whatever they had planned to feel, what actually arrives is quieter and harder to name.</p>
    <p class="body">Makkah does not sleep in any observable sense. The prayer continues through the night in shifts nobody organises. The cranes on the skyline pause; the circling below them does not. A city built in a valley of bare rock, without a river, without farmland, without any of the ordinary reasons cities exist, has been continuously inhabited and continuously visited for longer than almost anywhere on earth. The reason is visible from this window and it is not the architecture.</p>
    <p class="body">Above the old centre stands the clock tower, visible from everywhere, enormous beyond argument. Opinions differ on it and will continue to. But at dusk, with the crescent lit at its peak, it does what minarets have always done: it tells you, from a great distance, exactly where you are going.</p>
  </div>
</section>`,

/* 14 */
`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">III &nbsp;&middot;&nbsp; The House</div>
    <hr class="text-rule">
    <p class="body">The building at the centre is a cube of stone draped in black silk, and it is the plainest structure in the entire city. Everything around it reaches upward: minarets, hotels, cranes, the tower with its clock. The Kaaba does not reach. It sits. And a quarter of humanity turns toward it five times a day from wherever on earth they happen to be standing.</p>
    <p class="body">The tradition holds that this is the first house of worship established for mankind, raised by Ibrahim and his son Ismail, peace be upon them both, on foundations older than either. Whatever a visitor brings to that account, it explains something the eye confirms on its own: nothing about the building asks to be admired. It was never architecture. It is an address. The one fixed point toward which the daily prayers of a billion and a half people travel, and from which, standing here, there is nowhere further to go.</p>
    <p class="body">This is what the word qibla means: direction. Every mosque on earth is built as a compass needle, and this is where they all point. To arrive is to stand at the place where direction itself ends.</p>
  </div>
</section>`,

`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">IV &nbsp;&middot;&nbsp; The Circling</div>
    <hr class="text-rule">
    <p class="body">The crowd moves around the Kaaba in a slow, constant circle that has not stopped, day or night, for as long as anyone can establish. Seven circuits, anticlockwise, beginning at the corner that holds the black stone, which the tradition records the Prophet &#65018; kissing, and which pilgrims therefore reach toward as they pass, most of them from a distance, with a raised hand and a word.</p>
    <p class="body">The old are carried. The young carry. Individual people enter the circle and are absorbed by it, and from the upper floors the movement looks like water finding its level. From within it there is no view at all: only the black cloth ahead, nearer with each turn, and the press of every nation on earth around you, and the words each person brought with them, said under the breath in a hundred languages at once.</p>
    <p class="body">The books describe the angels circling the Throne in exactly this way, and the tawaf as the earthly echo of it. Whether the pilgrim holds that thought or simply concentrates on keeping their footing, the body learns something the mind takes longer to accept: the centre does not move. You do. Nobody times it. Nobody has ever wanted it to end quickly.</p>
  </div>
</section>`,

/* 21 */
`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">V &nbsp;&middot;&nbsp; The Running</div>
    <hr class="text-rule">
    <p class="body">There are no photographs in this chapter. The two rites it describes take place inside the mosque, in crowds, in movement, and the camera was left to rest. What follows is only what the tradition itself recounts and what any pilgrim can confirm from the inside.</p>
    <p class="body">Between two low hills, Safa and Marwah, now enclosed within the mosque as a long marble gallery, the pilgrims walk seven lengths. The rite remembers a woman: Hajar, wife of Ibrahim and mother of Ismail, peace be upon them, left in this valley when it was nothing but rock, running between these two hills searching the horizon for water for her child. The tradition holds that her desperation was answered with a spring at the infant&rsquo;s feet, and that God so honoured her running that He made it a pillar of the pilgrimage until the end of time.</p>
    <p class="body">It is worth pausing on what that means. Millions of people, every year, re-enact the footsteps of a mother in distress. Kings have made this walk. Scholars, athletes, grandmothers on mobility scooters in a dedicated lane. Of all the moments the rites could have preserved, this is the one sewn permanently into the journey: not a victory, not a conquest, a mother refusing to give up.</p>
  </div>
</section>`,

/* 22 */
`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">V &nbsp;&middot;&nbsp; The Water</div>
    <hr class="text-rule">
    <p class="body">The spring is called Zamzam, and it has not stopped. The well sits beneath the mosque now, and its water is piped to dispensers along every corridor: green-lidded containers, stacks of paper cups, a floor kept permanently and slightly wet. Pilgrims drink standing, facing the House, and many bring bottles to fill for people at home who asked for nothing else.</p>
    <p class="body">The books record the Prophet {S} saying that Zamzam is a water for whatever it is drunk for: the thirsty drink it for thirst, the ill for healing, the anxious for peace. The visitor notices something simpler first. In a desert valley with no river, a single spring has sustained an uninterrupted city for thousands of years, and the city has never once taken it for granted. Every cup is poured as if it were the first.</p>
    <p class="body">The taste is heavier than ordinary water, slightly mineral. Pilgrims describe it the way people describe the voice of someone they love: inaccurately, and at length.</p>
  </div>
</section>`,

`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">VI &nbsp;&middot;&nbsp; The Cloth</div>
    <hr class="text-rule">
    <p class="body">The Kaaba wears a garment, and the garment has a name: the kiswah. Black silk, embroidered in gold and silver thread with verses, remade in its entirety every single year in a workshop on the edge of the city, by craftsmen who spend their whole careers on a fabric that will hang for twelve months and then be cut into pieces and given away as gifts of state.</p>
    <p class="body">The numbers are worth recording. Around six hundred and seventy kilograms of raw silk. A hundred and twenty of gold and silver thread. Two hundred artisans: dyers, weavers, calligraphers whose lettering is embroidered over in thread by hands that follow it stroke for stroke. The tradition of clothing the House is older than Islam itself; the care taken over it has only compounded. Nothing this near to the centre is permitted to fade.</p>
    <p class="body">Up close, the belt of calligraphy resolves into individual stitches. Somebody made every one of them. Their names are not on it, and the craftsmen are recorded as considering this the honour of the work rather than its price.</p>
  </div>
</section>`,

`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">VII &nbsp;&middot;&nbsp; The Nations</div>
    <hr class="text-rule">
    <p class="body">Sit still in any corridor of the mosque for ten minutes and the whole world passes. Indonesian grandmothers in white, moving in careful convoys. Nigerian men in green, reciting quietly. Turkish families, Uzbek scholars, reverts from cities that have no mosque, carried here by savings gathered over decades. Nobody checks anyone&rsquo;s passport at prayer. The rows form by arrival time, not by nation, and a millionaire prays shoulder to shoulder with the man who swept the marble an hour earlier.</p>
    <p class="body">This is the other thing the photographs keep finding: not the building but the levelling. In the sermon the books record as his last, delivered a few miles from here, the Prophet &#65018; declared that no Arab has superiority over a non-Arab, nor white over black, except in conduct. The white cloth was the beginning of it. The prayer rows complete it. And every pilgrim knows, because the tradition does not let them forget, that the same unstitched cloth worn at the beginning of the journey is what they will one day be buried in.</p>
    <p class="body">There is no other place on earth where humanity organises itself this way, at this scale, every single day, without anyone directing it.</p>
  </div>
</section>`,

`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">VIII &nbsp;&middot;&nbsp; The Sanctuary</div>
    <hr class="text-rule">
    <p class="body">The mosque that surrounds the House is vast beyond photographing: corridor after corridor of chandeliers and cool marble, ceilings of carved geometry, gates numbered past a hundred, each with its own inscription and its own scrolling screen of supplications. It absorbs two million people and remains, somehow, a quiet building. The scale is not for display. It is for capacity, which is a different and humbler kind of ambition.</p>
    <p class="body">The details repay attention. Shelves of Qur&rsquo;ans in brass cages stand every few columns, in every script and size, thumbed soft at the corners by a hundred nationalities of hands. The green carpets mark where the prayer rows form. The marble underfoot is a stone chosen because it stays cool in a valley where summer passes fifty degrees, and barefoot pilgrims notice this mercy every single day without knowing its name.</p>
    <p class="body">A building this large should feel like an airport. It feels, instead, like weather: something you are inside of, that was here before you and continues after, entirely indifferent to and entirely arranged around the human being at its centre.</p>
  </div>
</section>`,

/* 36 */
`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">VIII &nbsp;&middot;&nbsp; Night</div>
    <hr class="text-rule">
    <p class="body">The mosque is at its most itself between midnight and dawn. The day crowds thin, the marble releases its stored heat, and the people who remain are the ones who came precisely for these hours: readers under the lamps, old men with their feet folded beneath them, night workers of the soul putting in their shift.</p>
    <p class="body">The minarets hold their light against the dark, and the lanterns along the arcades burn in rows that recede past counting. Outside, one of the largest cities in the region goes about its night. Inside, the only sound is recitation, somewhere, always, from a direction that can never quite be placed.</p>
    <p class="body">Pilgrims are told before they travel that the mosque never closes and never empties. It is one thing to be told. It is another to stand in it at three in the morning and understand that this has been true, without a single night&rsquo;s interruption, for longer than most nations have existed.</p>
  </div>
</section>`,

/* 42 */
`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">IX &nbsp;&middot;&nbsp; The Nearness</div>
    <hr class="text-rule">
    <p class="body">There is a moment, somewhere in the circling, when the crowd loosens for a breath and the cloth is suddenly close enough to read. Gold thread on black silk. Verses embroidered by hand, by craftsmen whose names are not on it, renewed every year without fail, because nothing this near to the centre is permitted to fade.</p>
    <p class="body">This is as near as most people will ever be. Some reach out. Some cannot. Some weep without deciding to, and are held up by strangers who do not ask why, because nobody here needs the reason explained. Nobody photographs well in this moment, and nobody minds, because this was never the point of the journey that a photograph could hold anyway.</p>
    <p class="bodyi">The camera stops here. The pilgrim continues.</p>
  </div>
</section>`,

`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">X &nbsp;&middot;&nbsp; The Road North</div>
    <hr class="text-rule">
    <p class="body">Four hundred and fifty kilometres separate the two sanctuaries, and the road between them carries more weight than any road on earth. The Prophet &#65018; travelled it once, northward, in flight: his city had turned on him, a price had been set, and he left by night with a single companion, Abu Bakr, hiding first in a cave in the mountain of Thawr while search parties passed close enough to be heard.</p>
    <p class="body">The books record the companion&rsquo;s fear in that cave, and the answer he received: do not grieve, God is with us. The two men then rode north through September heat, by back routes, for around two weeks. That journey is called the Hijrah, the migration, and its importance is measured by a simple fact: the Muslim calendar does not begin with the Prophet&rsquo;s &#65018; birth, nor with the first revelation. It begins with this road.</p>
    <p class="body">Everything that followed, the tradition holds, followed from this crossing: the first community, the first constitution, the city that took a hunted man in and became, because of it, one of the two poles of a civilisation. A road out of danger became the axis of a calendar. It is difficult to think of another journey in human history that carries so much.</p>
  </div>
</section>`,

/* 46 */
`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">X &nbsp;&middot;&nbsp; Two Hours</div>
    <hr class="text-rule">
    <p class="body">Today a train makes the crossing in two hours. The Haramain line runs at three hundred kilometres per hour over the same desert, and the onboard screen shows the route drawn across the map, the speed steady at two hundred and eighty-one, and the destination written in a font that takes none of it seriously: Madinah. Pilgrims doze. Children negotiate for snacks. The mountains through the window are the same mountains.</p>
    <p class="body">It is worth sitting with the arithmetic. What cost two weeks of fear and thirst now costs an afternoon nap. The pilgrims on the train have not forgotten this; it is, in a quiet way, the entire reason the train exists, and the reason the line is named for the two sanctuaries it joins rather than for any city along the way.</p>
    <p class="body">Somewhere past the halfway mark the landscape softens. Volcanic rock gives way to palm country. The old travellers knew the change of ground meant the city of the Prophet &#65018; was near, and would quicken their pace. The train does not quicken. The passengers do.</p>
  </div>
</section>`,

`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">XI &nbsp;&middot;&nbsp; The Illuminated City</div>
    <hr class="text-rule">
    <p class="body">The register changes completely. Makkah is gravity. Madinah is rest. Pilgrims arrive here exhausted and something in the city receives that exhaustion and answers it. Nobody who has made the journey needs this explained, and nobody who has not will quite believe how physical the difference is.</p>
    <p class="body">This is the city that took the Prophet &#65018; in when his own would not. It was called Yathrib then; it has been called al-Madinah al-Munawwarah, the Illuminated City, ever since, and the light in the name is not a metaphor the visitor has to work for. It is there in the late afternoon, on the stone of the plazas, under the great umbrellas that open each morning over the courtyards like a garden blooming on schedule, and close again at dusk with a slowness that gathers its own small crowds.</p>
    <p class="body">The city sits in an oasis ringed by volcanic hills, with the mountain of Uhud standing to the north. The books record the Prophet &#65018; praying for Madinah to be blessed, and asking that the love of it be placed in the hearts of those who come. Pilgrims who know that prayer tend to recall it on the first evening, unprompted, when the heat lifts and the swifts come out over the plaza and the whole city seems to exhale.</p>
  </div>
</section>`,

/* 53 */
`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">XI &nbsp;&middot;&nbsp; The Greeting</div>
    <hr class="text-rule">
    <p class="body">Beneath the green dome lies the man whose city this is &#65018;. The dome has been painted that colour since 1837 and has become, quietly, one of the most recognised silhouettes on earth. The nearness here is different from Makkah&rsquo;s: not a building at the centre of the world, but a person.</p>
    <p class="body">The line to stand before the grave moves slowly and in near silence. What each visitor says there is brief and almost identical, and has been for fourteen centuries: peace be upon you, O Messenger of God. The tradition records that the greeting is answered. Visitors do not discuss this much afterwards. It is noticeable how little they discuss it.</p>
    <p class="body">People travel five thousand miles to say one sentence in person, having said it from a distance all their lives. Whatever a reader makes of that, it is among the most consistent human behaviours on record: unbroken, undiminished, and conducted at a volume just above a whisper.</p>
  </div>
</section>`,

/* 57 */
`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">XII &nbsp;&middot;&nbsp; The Interior</div>
    <hr class="text-rule">
    <p class="body">The interior rewards slowness. The columns are dressed in white marble with gilded collars, and the arches above them alternate dark and pale stone in a rhythm that continues, bay after bay, further than the eye can resolve. Ottoman craftsmen decorated one section, Mamluk hands another, the Saudi expansions added acres more, and somehow the whole thing reads as one continuous room.</p>
    <p class="body">People live here during their stay in a way no other great building permits. They read against the columns. They sleep between prayers. They eat dates quietly and share them with strangers. The building has held prayer continuously for fourteen centuries, and it carries that use the way old furniture carries polish: not as wear, but as depth.</p>
    <p class="body">In the oldest quarter the ceilings drop, the chandeliers age a century at a stride, and the tilework turns Ottoman blue and green. The mosque does not hide its layers or restore them into sameness. Each dynasty&rsquo;s devotion is left legible, which makes walking through the building a walk through everyone who ever loved it.</p>
  </div>
</section>`,

`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">XII &nbsp;&middot;&nbsp; The Garden</div>
    <hr class="text-rule">
    <p class="body">Within the old section is a small area of carpet, green where all the rest is red, marking the space the books record the Prophet &#65018; describing as a garden from the gardens of Paradise: the Rawdah, between what was once his house and his pulpit. It is a modest rectangle by the standards of everything around it. The queue for it forms before dawn and never entirely disperses.</p>
    <p class="body">Pilgrims wait hours for the chance to pray briefly on that green carpet. Watching the patience of the queue, its lack of complaint, the way the elderly are moved gently toward the front by strangers, a visitor learns more about what the place means than any inscription could teach.</p>
    <p class="body">The mosque grew outward from a courtyard of mud brick and palm trunks, where the Prophet &#65018; taught, judged, received delegations and lived in rooms along the eastern wall. Everything the eye now sees, the marble, the gold, the acres of carpet, is the shell around that first modest room. The visitor who holds this thought walks differently through the building.</p>
  </div>
</section>`,

`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">XIII &nbsp;&middot;&nbsp; The Provision</div>
    <hr class="text-rule">
    <p class="body">Before the sunset prayer, plastic sheets unroll down the length of the carpets, and on them appear dates, bread, yoghurt, coffee: thousands of individual meals, laid out by people who will not eat them. Families in Madinah compete for the honour. Some have held the same stretch of carpet for generations, and guard the right to feed strangers there the way other families guard land.</p>
    <p class="body">The guest of the two sanctuaries is regarded, in the tradition, as the guest of God, and Madinah takes the implication personally. A pilgrim can arrive with nothing at the right hour and be fed, insistently, by six different hosts before finding a place to sit. The books record the Prophet &#65018; saying that whoever believes in God and the Last Day should honour their guest; his city has treated the sentence as standing orders for fourteen hundred years.</p>
    <p class="body">The dates themselves carry lineage here. The ajwa variety, dark and soft, is grown in the oasis and mentioned in the tradition by name; boxes of it travel home in almost every suitcase. Hospitality at this scale does not look like a banquet. It looks like logistics, performed nightly, for no one&rsquo;s credit.</p>
  </div>
</section>`,

/* 68 */
`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">XIII &nbsp;&middot;&nbsp; Evening</div>
    <hr class="text-rule">
    <p class="body">The call to prayer moves across Madinah the way weather moves: beginning at the great mosque and taken up, seconds apart, by every minaret in the oasis, until the whole city is one staggered voice. Traffic thins mid-street. Shops empty with the tills still open, watched by nobody and touched by nobody. The city performs this trust five times a day and has stopped noticing it does so.</p>
    <p class="body">At sunset the plazas fill rather than empty. Families spread mats. Children run the marble in socked feet. The umbrella towers fold down against an orange sky, and the dome, floodlit now, takes on the exact green of the carpet in the garden it stands over.</p>
    <p class="body">Photographs of this hour tend to look staged. They are not. The city simply arranges itself, every evening, into compositions no one has planned, made of light nobody rented and patience nobody performed. The camera&rsquo;s only job is to be present and to hold still.</p>
  </div>
</section>`,

`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">XIV &nbsp;&middot;&nbsp; Quba</div>
    <hr class="text-rule">
    <p class="body">On the southern edge of the city stands the first mosque of them all: Quba, founded by the Prophet &#65018; on his arrival from Makkah, before he had even entered the city that would take his name. The books record him laying its first stones with his own hands, and returning every Saturday for the rest of his life, and saying that prayer within it carries the reward of a lesser pilgrimage. The building has been rebuilt many times since. The significance has not moved an inch.</p>
    <p class="body">So the pilgrims come as he came, in the late afternoon mostly, and pray briefly, and sit for a while in the shade. It is a lighter place than the great mosques: white and open under a wide sky, green-banded arches inside, the names of the companions set in gold medallions along the vaults, palms at its edges and pigeons working the courtyards.</p>
    <p class="body">At sunset the minarets go to silhouette and a single bird crosses the frame, and for a moment the fourteen centuries between the first mud-brick courtyard and this evening feel very short indeed.</p>
  </div>
</section>`,

`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">XV &nbsp;&middot;&nbsp; Uhud</div>
    <hr class="text-rule">
    <p class="body">North of the city the mountain of Uhud stands red-brown and bare, and at its foot lies the field where the young community&rsquo;s hardest day was endured. Seventy of the companions fell here, among them the Prophet&rsquo;s &#65018; uncle Hamzah, and the visit to their resting place is made in near silence, because there is a form of greeting taught for it and very little to add.</p>
    <p class="body">The books record the Prophet &#65018; saying of this mountain: Uhud is a mountain that loves us, and we love it. Visitors tend to look up at the rock differently after learning the sentence. Geology is not usually spoken of this way. Here, it is.</p>
    <p class="body">The city has grown to meet the mountain, and around its sites of memory it has built quarters of remembrance: walls where the names of the prophets, peace be upon them all, are cut in light, museums of the Hijrah route, gardens planted where armies once formed. A place this old does not preserve its history behind glass. It continues living in the middle of it.</p>
  </div>
</section>`,

`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">XVI &nbsp;&middot;&nbsp; The City That Continues</div>
    <hr class="text-rule">
    <p class="body">Around the sanctuaries, life continues at its own scale, and it would be dishonest to leave it out. A caf&eacute; under the date palms where the gravel is raked and the chairs are bentwood and the shade does the work air conditioning does everywhere else. A coffee counter where the cups are stacked in patterned sleeves and the machine is the colour of terracotta. The holy cities are also, simply, cities, and their ordinary mornings deserve a page.</p>
    <p class="body">This, too, is old. The pilgrimage has always had its markets; the tradition itself makes room for trade on the journey. The caravans carried spices and cloth alongside the pilgrims, and the cities have been receiving, feeding, housing and remembering guests for so long that hospitality is not their industry but their character. What has changed is only the espresso machine.</p>
  </div>
</section>`,

/* 87 */
`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">XVI &nbsp;&middot;&nbsp; What Travels Home</div>
    <hr class="text-rule">
    <p class="body">Then there are the objects that make the journey home. Oud wood in a shop drawer, sold by weight. Attar in small bottles, chosen slowly, because the books record that the Prophet &#65018; loved perfume, and his community has never needed a second reason. A misbaha of pale amber, coiled on a table beside the watches and the pen, with the sanctuary out of focus through the window behind. Zamzam in sealed containers, checked in as luggage, carried up staircases at home and rationed for years.</p>
    <p class="body">Scent is the pilgrim&rsquo;s photograph: years later, one breath of the right oil returns the entire journey in a way no image manages. The objects are not souvenirs in the ordinary sense. They are witnesses, kept where they can be seen, of a promise the traveller made to themselves about the person they intended to be on the way home.</p>
  </div>
</section>`,

/* 89 */
`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">XVI &nbsp;&middot;&nbsp; The Farewell</div>
    <hr class="text-rule">
    <p class="body">Leaving is its own ritual. There is a final circling in Makkah, and the books name it exactly what it is: the tawaf of farewell. Most people perform it more slowly than they need to, and walk backwards out of the mosque for the last few steps without quite deciding to, keeping the House in sight until a pillar finally takes it.</p>
    <p class="body">Then the coach, the airport, the ordinary indignities of travel, and somewhere over the sea the white cloth goes back into the suitcase and the pilgrim becomes a passenger again. Except not entirely. Ask anyone who has been. Something in the ordering of their days is different afterwards, usually quietly, occasionally completely. The tradition says an accepted pilgrimage leaves its sign not in the certificate or the photographs but in the person who returns. The journey continues working long after the return, which is the one thing about it that everyone agrees on and nobody can explain.</p>
    <p class="body">In a night market, a painting of the green dome stands on an easel among modern canvases. Someone who was here tried to hold it too, in oil instead of light. Every pilgrim carries a version home: a painting, a photograph, a scent, a date pressed in a suitcase. None of them are the place. All of them point at it.</p>
  </div>
</section>`,

`<section class="page">
  <div class="textwrap">
    <div class="section-label">Closing Reflection</div>
    <p class="body">This publication set out knowing it would fail, in the way any photograph of these two cities fails. What the pilgrim goes to find is not visible. It does not reflect light. The camera, which knows only light, spends the whole journey documenting the container and never the thing contained.</p>
    <p class="body">And yet the container is worth holding. The gold thread on the black silk, renewed every year without fail. The train crossing the Hijrah road in two hours. The green carpet where the queue forms before dawn. The meals laid out nightly by families who will not eat them. The old man asleep against the column, five thousand miles from his front door and entirely at home. These are the edges of something, photographed carefully, in the hope that an edge is enough to suggest the shape of the whole.</p>
    <p class="body">Forty-three photographs of the nearest that most of us will ever be. The chapters without photographs are not gaps. They mark the places where the camera was set down on purpose, which are the places the journey was actually about. Those who know, know. This book is for them, and for the ones still intending to go.</p>

const N = PAGES.length;
const KEY = 'mkd-reader-' + location.pathname;
let cur = 0;
let busy = false;
let cTimer;

const mPanel  = document.getElementById('mobile-panel');
const pLeft   = document.getElementById('panel-left');
const pRight  = document.getElementById('panel-right');
const counter = document.getElementById('counter');
const btnPrev = document.getElementById('btn-prev');
const btnNext = document.getElementById('btn-next');

const isDesk = () => window.innerWidth >= 900;

function inject(el, idx) {
  if (!el) return;
  if (idx < 0 || idx >= N) {
    el.innerHTML = '';
    el.style.background = 'var(--linen)';
    return;
  }
  el.innerHTML = PAGES[idx];
  const pg = el.querySelector('.page');
  const isDark = pg && (pg.classList.contains('plate') || pg.classList.contains('dark-page'));
  el.style.background = isDark ? 'var(--dark)' : 'var(--linen)';
}

function tick(n) {
  try { localStorage.setItem(KEY, cur); } catch (e) {}
  counter.textContent = n + ' / ' + N;
  counter.classList.remove('fade');
  counter.classList.add('show');
  clearTimeout(cTimer);
  cTimer = setTimeout(() => counter.classList.add('fade'), 2400);
}

function renderDesk(idx) {
  const left = idx % 2 === 0 ? idx : idx - 1;
  cur = Math.max(0, Math.min(N - 1, left));
  inject(pLeft,  cur);
  inject(pRight, cur + 1 < N ? cur + 1 : -1);
  tick(cur + 1);
}

function renderMobile(idx) {
  cur = Math.max(0, Math.min(N - 1, idx));
  inject(mPanel, cur);
  tick(cur + 1);
}

function slide(dir, newIdx) {
  if (busy) return;
  busy = true;
  const out = mPanel.cloneNode(true);
  out.style.cssText = 'position:absolute;inset:0;z-index:3;';
  document.getElementById('mobile-wrap').appendChild(out);
  inject(mPanel, newIdx);
  cur = newIdx;
  tick(cur + 1);
  const inCls  = dir === 'next' ? 'pg-enter-right' : 'pg-enter-left';
  const outCls = dir === 'next' ? 'pg-exit-left'   : 'pg-exit-right';
  mPanel.style.animation = 'none';
  void mPanel.offsetWidth;
  mPanel.classList.add(inCls);
  out.classList.add(outCls);
  setTimeout(() => {
    out.remove();
    mPanel.classList.remove(inCls);
    busy = false;
  }, 480);
}

function next() {
  if (isDesk()) { renderDesk(cur + 2); }
  else { if (cur < N - 1) slide('next', cur + 1); }
}
function prev() {
  if (isDesk()) { renderDesk(cur - 2); }
  else { if (cur > 0) slide('prev', cur - 1); }
}

function enter(start) {
  start = start || 0;
  document.getElementById('intro').classList.add('gone');
  setTimeout(() => document.getElementById('hint').classList.add('gone'), 3500);
  if (isDesk()) {
    btnPrev.style.display = btnNext.style.display = 'block';
    renderDesk(start);
  } else {
    renderMobile(start);
  }
}

(function () {
  let s = 0;
  try { s = parseInt(localStorage.getItem(KEY), 10) || 0; } catch (e) {}
  if (s > 0 && s < N - 1) {
    const first = document.querySelector('.intro-open');
    if (!first) return;
    const cont = first.cloneNode(false);
    cont.textContent = 'Continue from page ' + (s + 1);
    cont.removeAttribute('onclick');
    cont.onclick = function () { enter(s); };
    cont.style.marginTop = '1rem';
    first.insertAdjacentElement('afterend', cont);
    first.textContent = 'Start from the beginning';
  }
})();

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
});

let sx = 0, sy = 0;
document.addEventListener('touchstart', e => {
  sx = e.touches[0].clientX; sy = e.touches[0].clientY;
}, {passive:true});
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  const dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy))
    dx < 0 ? next() : prev();
}, {passive:true});

let wasDesk = isDesk();
window.addEventListener('resize', () => {
  const now = isDesk();
  if (now !== wasDesk) {
    wasDesk = now;
    btnPrev.style.display = btnNext.style.display = now ? 'block' : 'none';
    if (now) renderDesk(cur);
    else renderMobile(cur);
  }
});
</script>
