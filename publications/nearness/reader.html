<style>

*, *::before, *::after {

/* ── PAGES ──────────────────────────────── */

.page {
  width: 100%; height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: var(--linen);

}

.page::before {

}
.page::after {

/* ── MOBILE LAYOUT ─────────────────────── */
#mobile-wrap { position: fixed; inset: 0; }

.pg-enter-right { animation: pgInRight .46s cubic-bezier(.7,0,.2,1) both; }

@keyframes pgInLeft   { from{transform:translateX(-100%)} to{transform:translateX(0)} }

.intro-title {

@media (prefers-reduced-motion: reduce) {

  .pg-exit-left, .pg-exit-right { animation: none; }

<script>
const PAGES = [

/* 01 — COVER */
`<section class="page dark-page">
  <div class="cover-wrap">
    <div class="cover-title">Nearness</div>
    <div class="cover-subtitle">Pilgrimage / Volume I</div>

/* 02 — TITLE PAGE */
`<section class="page">
  <div class="title-wrap">
    <div class="title-main">Nearness</div>
    <div class="title-sub">Pilgrimage, Volume I<br>Makkah &nbsp;&middot;&nbsp; Madinah</div>
    <div class="title-studio">mkd STUDIO</div>
    <div class="title-note">Two cities you do not visit. You are received.</div>

</section>`,

/* 03 — COLOPHON */
`<section class="page">
  <div class="colophon-wrap">
    <p>Photography and editorial direction</p>
    <p>mkd STUDIO</p>
    <hr class="col-rule">
    <p>Makkah al-Mukarramah, Saudi Arabia</p>
    <p>Madinah al-Munawwarah, Saudi Arabia</p>
    <p>Photographed September 2025</p>
    <p>Published 2026</p>
    <hr class="col-rule">
    <p>All photography, editorial writing and publication design<br>are protected by copyright.</p>
    <p>No part of this publication may be reproduced<br>in any form without prior written permission.</p>
    <hr class="col-rule">
    <p>First edition &nbsp;&middot;&nbsp; 2026</p>
  </div>
</section>`,

/* 04 — INTRODUCTION */
`<section class="page">
  <div class="textwrap">
    <div class="section-label">Introduction</div>
    <p class="body">Every other publication in this catalogue documents a place that can be visited. This one does not. Makkah and Madinah are not destinations in the ordinary sense: nobody passes through, nobody stumbles across them, and nobody arrives without having intended to for a long time, sometimes a whole life.</p>
    <p class="body">The camera is an awkward companion on a journey like this. It wants to stand back, and the entire point of being here is nearness: to the Kaaba, to the Prophet&rsquo;s mosque, to the millions who have stood on the same marble before you and the millions who will after. Most of what matters cannot be photographed at all.</p>
    <p class="body">These photographs do not attempt the whole. They hold the edges of it: the first sight of the sanctuary from a dark window, the embroidery on a door, the quiet of a courtyard at sunset, the objects that travel home. What they surround, each reader will know or will not, and no caption can change which.</p>
    <p class="body i" style="margin-top:1.8rem;color:var(--mid)">Twenty-seven photographs. Five sections. One journey.</p>
  </div>
</section>`,

/* 05 — CHAPTER I */
`<section class="page">
  <div class="chapter-wrap">
    <div class="ch-num">I</div>
    <div class="ch-rule"></div>
    <div class="ch-name">Before</div>
  </div>
</section>`,

/* 06 — IMAGE: nearness-01 (haram at night through dark window) */
`<section class="page plate">
  <img src="/images/nearness-01.jpg?v=2" alt="The Grand Mosque at night, seen from a dark hotel window, Makkah al-Mukarramah">
</section>`,

/* 07 — BEFORE TEXT */
`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">I &nbsp;&middot;&nbsp; Before</div>
    <hr class="text-rule">
    <p class="body">The journey begins long before the aeroplane. It begins with an intention, spoken quietly, and with two lengths of white cloth that make a king indistinguishable from anyone else. By the time the city appears, the traveller has already been changed into a pilgrim, and the difference is not cosmetic.</p>
    <p class="body">The first sight of the sanctuary usually arrives at an odd moment. Through a coach window in traffic. Between buildings. Or, as here, at three in the morning from an unlit hotel room: the mosque below, white and gold against the dark, still moving with people at an hour when every other city in the world has gone quiet. Nobody sleeps well the night they arrive. This is what the window is for.</p>
    <p class="body">Above the old centre stands the clock tower, visible from everywhere, enormous beyond argument. Opinions differ on it and will continue to. But at dusk, with the crescent lit at its peak, it does what minarets have always done: it tells you, from a great distance, exactly where you are going.</p>
  </div>
</section>`,

/* 08 — IMAGE: nearness-02 (clock tower at dusk) */
`<section class="page plate">
  <img src="/images/nearness-02.jpg?v=2" alt="The Makkah clock tower at dusk, crescent lit, Makkah al-Mukarramah">
</section>`,

/* 09 — CHAPTER II */
`<section class="page">
  <div class="chapter-wrap">
    <div class="ch-num">II</div>
    <div class="ch-rule"></div>
    <div class="ch-name">Makkah</div>
  </div>
</section>`,

/* 10 — IMAGE: makkah-01 (Kaaba through dark frame) */
`<section class="page plate">
  <img src="/images/makkah-01.jpg" alt="The Kaaba seen through a dark architectural frame, Makkah al-Mukarramah">
</section>`,

/* 11 — MAKKAH TEXT */
`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">II &nbsp;&middot;&nbsp; Makkah</div>
    <hr class="text-rule">
    <p class="body">The building at the centre is a cube of stone draped in black silk, and it is the plainest structure in the entire city. Everything around it reaches upward: minarets, hotels, cranes, the tower with its clock. The Kaaba does not reach. It sits. And a quarter of humanity turns toward it five times a day from wherever on earth they happen to be standing.</p>
    <p class="body">Gravity is the only honest word for what it does. The crowd moves around it in a slow constant circle that has not stopped, day or night, for centuries. Individual people enter the circle and are absorbed by it. From the upper floors the movement looks like water finding its level. From within it, there is no view at all: only the black cloth ahead, nearer with each turn, and the press of every nation on earth around you.</p>
    <p class="body">The mosque that surrounds this is vast beyond photographing, corridor after corridor of chandeliers and cool marble, shelves of Qur&rsquo;ans in brass cages, green carpets that mark where prayer rows form. It absorbs two million people and remains, somehow, a quiet building. The scale is not for display. It is for capacity, which is a different and humbler kind of ambition.</p>
  </div>
</section>`,

`<section class="page plate">
  <img src="/images/makkah-02.jpg" alt="The Kaaba surrounded by the crowd, Grand Mosque, Makkah al-Mukarramah">
</section>`,

/* 13 — IMAGE: makkah-04 (Kaaba corner at night, clock tower above) */
`<section class="page plate">
  <img src="/images/makkah-04.jpg" alt="Kaaba corner at night with gold calligraphy and the clock tower above, Makkah al-Mukarramah">

/* 14 — IMAGE: nearness-03 (kiswa door full frame) */

/* 15 — IMAGE: makkah-06 (kiswah band detail) */

/* 16 — IMAGE: nearness-04 (congregation under chandelier) */
`<section class="page plate">

/* 17 — IMAGE: nearness-05 (pilgrims in dark arches) */

/* 18 — THE NATIONS TEXT */
`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">II &nbsp;&middot;&nbsp; Makkah</div>
    <hr class="text-rule">
    <p class="body">Sit still in any corridor of the mosque for ten minutes and the whole world passes. Indonesian grandmothers in white, moving in careful convoys. Nigerian men in green, singing quietly. Turkish families, Uzbek scholars, converts from cities that have no mosque, carried here by savings gathered over decades. Nobody checks anyone&rsquo;s passport at prayer. The rows form by arrival time, not by nation, and a millionaire prays shoulder to shoulder with the man who swept the marble an hour earlier.</p>
    <p class="body">This is the other thing the photographs keep finding: not the building but the levelling. Two lengths of white cloth were the beginning of it. The prayer rows complete it. There is no other place on earth where humanity organises itself this way, at this scale, every single day, without anyone directing it.</p>
  </div>
</section>`,

/* 22 — CLOSING LINE II */

/* 25 — THE NEARNESS TEXT */
`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">III &nbsp;&middot;&nbsp; The Nearness</div>
    <hr class="text-rule">
    <p class="body">There is a moment, somewhere in the circling, when the crowd loosens for a breath and the cloth is suddenly close enough to read. Gold thread on black silk. Verses embroidered by hand, by craftsmen whose names are not on it, in a workshop that has been remaking this cloth every single year for generations.</p>
    <p class="body">This is as near as most people will ever be. Some reach out. Some cannot. Nobody photographs well here, and nobody minds, because this was never the point of the journey that the photograph could hold anyway.</p>
    <p class="body i" style="margin-top:1.8rem;color:var(--mid)">The camera stops here. The pilgrim continues.</p>

/* 28 — MADINAH TEXT */
`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">IV &nbsp;&middot;&nbsp; Madinah</div>
    <hr class="text-rule">
    <p class="body">Four hundred and fifty kilometres north, the register changes completely. Makkah is gravity. Madinah is rest. Pilgrims arrive here exhausted and something in the city receives that exhaustion and answers it. Nobody who has made the journey needs this explained, and nobody who has not will quite believe how physical the difference is.</p>
    <p class="body">The Prophet&rsquo;s mosque is one of the largest buildings in the world and behaves like a courtyard house. The great umbrellas open each morning over the plazas like a garden blooming on schedule. Inside, white and gold columns hold up a ceiling that took four centuries of dynasties to decorate, and old men lean against them reading, and children sleep on the green carpet, and nobody is hurried anywhere.</p>
    <p class="body">Beneath the green dome lies the man whose city this is. The dome has been painted that colour since 1837 and has become, quietly, one of the most recognised silhouettes on earth. The nearness here is different from Makkah&rsquo;s: not a building at the centre of the world, but a person, and the endless, patient, moving line of those who have come simply to say peace be upon you, in person, having travelled five thousand miles to say it.</p>
  </div>
</section>`,

/* 32 — THE INTERIOR TEXT */
`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">IV &nbsp;&middot;&nbsp; Madinah</div>
    <hr class="text-rule">
    <p class="body">The interior rewards slowness. The columns are dressed in white marble with gilded collars, and the arches above them alternate dark and pale stone in a rhythm that continues, bay after bay, further than the eye can resolve. Ottoman craftsmen decorated one section, Mamluk hands another, the Saudi expansions added acres more, and somehow the whole thing reads as one continuous room.</p>
    <p class="body">People live here during their stay in a way no other great building permits. They read against the columns. They sleep between prayers. They eat dates quietly and share them with strangers. The building has held prayer continuously for fourteen centuries, and it carries that use the way old furniture carries polish: not as wear, but as depth.</p>
  </div>
</section>`,

/* 38 — QUBA TEXT */
`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">IV &nbsp;&middot;&nbsp; Quba</div>
    <hr class="text-rule">
    <p class="body">On the southern edge of the city stands the first mosque of them all: Quba, founded by the Prophet himself on his arrival from Makkah, before he had even entered the city that would take his name. The building has been rebuilt many times since. The significance has not moved an inch.</p>
    <p class="body">It is a lighter place than the great mosques, white and open under a wide sky, with palms at its edges and pigeons working the courtyards. Pilgrims come here in the late afternoon, pray briefly, and sit for a while in the shade. At sunset the minarets go to silhouette and a single bird crosses the frame, and for a moment the fourteen centuries between the first mud-brick courtyard and this evening feel very short indeed.</p>
  </div>
</section>`,

/* 42 — WHAT STAYS TEXT */
`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">V &nbsp;&middot;&nbsp; What Stays</div>
    <hr class="text-rule">
    <p class="body">Around the sanctuaries, life continues at its own scale, and it would be dishonest to leave it out. A caf&eacute; under the date palms where the gravel is raked and the chairs are bentwood and the shade does the work air conditioning does everywhere else. A coffee counter where the cups are stacked in patterned sleeves and the machine is the colour of terracotta. The holy cities are also, simply, cities, and their ordinary mornings deserve a page.</p>
    <p class="body">Then there are the objects that make the journey home. Oud wood in a shop drawer, sold by weight. Attar in small bottles, chosen slowly. A misbaha of pale amber, coiled on a table beside the watches and the pen, with the sanctuary out of focus through the window behind. Scent is the pilgrim&rsquo;s photograph: years later, one breath of the right oil returns the entire journey in a way no image manages.</p>
    <p class="body">In a night market, a painting of the green dome stands on an easel among modern canvases. Someone who was here tried to hold it too, in oil instead of light. Every pilgrim carries a version home: a painting, a photograph, a scent, a date pressed in a suitcase. None of them are the place. All of them point at it.</p>
  </div>
</section>`,

/* 46 — THE RETURN TEXT */
`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">V &nbsp;&middot;&nbsp; The Return</div>
    <hr class="text-rule">
    <p class="body">Leaving is its own ritual. There is a final circling in Makkah, a farewell that the books name as such, and most people perform it more slowly than they need to. Then the coach, the airport, the ordinary indignities of travel, and somewhere over the sea the white cloth goes back into the suitcase and the pilgrim becomes a passenger again.</p>
    <p class="body">Except not entirely. Ask anyone who has been. Something in the ordering of their days is different afterwards, usually quietly, occasionally completely. The journey continues working long after the return, which is the one thing about it that everyone agrees on and nobody can explain.</p>
  </div>
</section>`,

/* 48 — CLOSING REFLECTION */
`<section class="page">
  <div class="textwrap">
    <div class="section-label">Closing Reflection</div>
    <p class="body">This publication set out knowing it would fail, in the way any photograph of these two cities fails. What the pilgrim goes to find is not visible. It does not reflect light. The camera, which knows only light, spends the whole journey documenting the container and never the thing contained.</p>
    <p class="body">And yet the container is worth holding. The gold thread on the black silk. The umbrellas opening at dawn. The old man asleep against the column, five thousand miles from his front door and entirely at home. These are the edges of something, photographed carefully, in the hope that an edge is enough to suggest the shape of the whole.</p>
    <p class="body">Twenty-seven photographs of the nearest that most of us will ever be. What was actually near cannot be printed. Those who know, know. This book is for them, and for the ones still intending to go.</p>

const N = PAGES.length;
let cur = 0;
let busy = false;
let cTimer;

const mPanel  = document.getElementById('mobile-panel');
const pLeft   = document.getElementById('panel-left');
const pRight  = document.getElementById('panel-right');
const counter = document.getElementById('counter');
const btnPrev = document.getElementById('btn-prev');
const btnNext = document.getElementById('btn-next');

const isDesk = () => window.innerWidth >= 900;

function inject(el, idx) {
  if (!el) return;
  if (idx < 0 || idx >= N) {
    el.innerHTML = '';
    el.style.background = 'var(--linen)';
    return;
  }
  el.innerHTML = PAGES[idx];
  const pg = el.querySelector('.page');
  const isDark = pg && (pg.classList.contains('plate') || pg.classList.contains('dark-page'));
  el.style.background = isDark ? 'var(--dark)' : 'var(--linen)';
}

function tick(n) {
  counter.textContent = n + ' / ' + N;
  counter.classList.remove('fade');
  counter.classList.add('show');
  clearTimeout(cTimer);
  cTimer = setTimeout(() => counter.classList.add('fade'), 2400);
}

function renderDesk(idx) {
  const left = idx % 2 === 0 ? idx : idx - 1;
  cur = Math.max(0, Math.min(N - 1, left));
  inject(pLeft,  cur);
  inject(pRight, cur + 1 < N ? cur + 1 : -1);
  tick(cur + 1);
}

function renderMobile(idx) {
  cur = Math.max(0, Math.min(N - 1, idx));
  inject(mPanel, cur);
  tick(cur + 1);
}

function slide(dir, newIdx) {
  if (busy) return;
  busy = true;
  const out = mPanel.cloneNode(true);
  out.style.cssText = 'position:absolute;inset:0;z-index:3;';
  document.getElementById('mobile-wrap').appendChild(out);
  inject(mPanel, newIdx);
  cur = newIdx;
  tick(cur + 1);
  const inCls  = dir === 'next' ? 'pg-enter-right' : 'pg-enter-left';
  const outCls = dir === 'next' ? 'pg-exit-left'   : 'pg-exit-right';
  mPanel.style.animation = 'none';
  void mPanel.offsetWidth;
  mPanel.classList.add(inCls);
  out.classList.add(outCls);
  setTimeout(() => {
    out.remove();
    mPanel.classList.remove(inCls);
    busy = false;
  }, 480);
}

function next() {
  if (isDesk()) { renderDesk(cur + 2); }
  else { if (cur < N - 1) slide('next', cur + 1); }
}
function prev() {
  if (isDesk()) { renderDesk(cur - 2); }
  else { if (cur > 0) slide('prev', cur - 1); }
}

function enter() {
  document.getElementById('intro').classList.add('gone');
  setTimeout(() => document.getElementById('hint').classList.add('gone'), 3500);
  if (isDesk()) {
    btnPrev.style.display = btnNext.style.display = 'block';
    renderDesk(0);
  } else {
    renderMobile(0);
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
});

let sx = 0, sy = 0;
document.addEventListener('touchstart', e => {
  sx = e.touches[0].clientX; sy = e.touches[0].clientY;
}, {passive:true});
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  const dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy))
    dx < 0 ? next() : prev();
}, {passive:true});

let wasDesk = isDesk();
window.addEventListener('resize', () => {
  const now = isDesk();
  if (now !== wasDesk) {
    wasDesk = now;
    btnPrev.style.display = btnNext.style.display = now ? 'block' : 'none';
    if (now) renderDesk(cur);
    else renderMobile(cur);
  }
});
</script>
