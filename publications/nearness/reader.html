/* ── PAGES ──────────────────────────────── */

.page {

  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;

<script>
const PAGES = [

/* 01 */
`<section class="page dark-page">
  <div class="cover-wrap">
    <div class="cover-title">Nearness</div>
    <div class="cover-subtitle">Pilgrimage / Volume I</div>

`<section class="page">
  <div class="title-wrap">
    <div class="title-main">Nearness</div>
    <div class="title-sub">Pilgrimage, Volume I<br>Makkah &nbsp;&middot;&nbsp; Madinah</div>
    <div class="title-studio">mkd STUDIO</div>

/* 03 */
`<section class="page">
  <div class="colophon-wrap">

    <p>mkd STUDIO</p>
    <hr class="col-rule">
    <p>Makkah al-Mukarramah, Saudi Arabia</p>

    <p>Photographed September 2025</p>

    <p>No part of this publication may be reproduced<br>in any form without prior written permission.</p>
    <hr class="col-rule">
    <p>First edition &nbsp;&middot;&nbsp; 2026</p>

/* 04 */
`<section class="page">
  <div class="textwrap">
    <div class="section-label">Introduction</div>
    <p class="body">Every other publication in this catalogue documents a place that can be visited. This one does not. Makkah and Madinah are not destinations in the ordinary sense: nobody passes through, nobody stumbles across them, and nobody arrives without having intended to for a long time, sometimes a whole life.</p>
    <p class="body">The camera is an awkward companion on a journey like this. It wants to stand back, and the entire point of being here is nearness: to the Kaaba, to the mosque of the Prophet &#65018;, to the millions who have stood on the same marble before you and the millions who will after. Most of what matters cannot be photographed at all.</p>
    <p class="body">These photographs do not attempt the whole. They hold the edges of it: the first sight of the sanctuary from a dark window, the embroidery on a door, the train that now crosses in two hours a distance that was once walked in flight, the quiet of Quba at sunset, the objects that travel home. What they surround, each reader will know or will not, and no caption can change which.</p>
    <p class="body i" style="margin-top:1.8rem;color:var(--mid)">Forty-three photographs. Seven sections. One journey.</p>
  </div>
</section>`,

/* 05 */
`<section class="page">
  <div class="chapter-wrap">
    <div class="ch-num">I</div>
    <div class="ch-rule"></div>
    <div class="ch-name">Before</div>
  </div>
</section>`,

/* 06 */
`<section class="page plate">
  <img src="/images/nearness-01.jpg?v=2" alt="The Grand Mosque at night, seen from a dark hotel window, Makkah al-Mukarramah">
</section>`,

/* 07 */
`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">I &nbsp;&middot;&nbsp; Before</div>
    <hr class="text-rule">
    <p class="body">The journey begins long before the aeroplane. It begins with an intention, spoken quietly, and with two lengths of white cloth that make a king indistinguishable from anyone else. The state is called ihram, which means prohibition: no perfume, no argument, no harm to so much as an insect. By the time the city appears, the traveller has already been changed into a pilgrim, and the difference is not cosmetic.</p>
    <p class="body">The first sight of the sanctuary usually arrives at an odd moment. Through a coach window in traffic. Between buildings. Or, as here, at three in the morning from an unlit hotel room: the mosque below, white and gold against the dark, still moving with people at an hour when every other city in the world has gone quiet. There is a prayer taught for this moment of first seeing. Nobody sleeps well the night they arrive. This is what the window is for.</p>
    <p class="body">Above the old centre stands the clock tower, visible from everywhere, enormous beyond argument. Opinions differ on it and will continue to. But at dusk, with the crescent lit at its peak, it does what minarets have always done: it tells you, from a great distance, exactly where you are going.</p>
  </div>
</section>`,

  <img src="/images/nearness-02.jpg?v=2" alt="The Makkah clock tower at dusk, crescent lit, Makkah al-Mukarramah">

/* 09 */
`<section class="page">
  <div class="chapter-wrap">
    <div class="ch-num">II</div>
    <div class="ch-rule"></div>

</section>`,

  <img src="/images/makkah-01.jpg?v=2" alt="The Kaaba seen through a dark architectural frame, Makkah al-Mukarramah">
</section>`,

/* 11 */
`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">II &nbsp;&middot;&nbsp; Makkah</div>
    <hr class="text-rule">
    <p class="body">The building at the centre is a cube of stone draped in black silk, and it is the plainest structure in the entire city. Everything around it reaches upward: minarets, hotels, cranes, the tower with its clock. The Kaaba does not reach. It sits. And a quarter of humanity turns toward it five times a day from wherever on earth they happen to be standing.</p>
    <p class="body">The tradition holds that this is the first house of worship established for mankind, raised by Ibrahim and his son Ismail, peace be upon them both, on foundations older than either. Whatever a visitor believes, the claim explains something the eye confirms: nothing about the building asks to be admired. It was never architecture. It is an address. The one fixed point toward which a billion prayers travel every day, and from which, standing here, there is nowhere further to go.</p>
    <p class="body">This is what the word qibla means: direction. Every mosque on earth is a compass needle, and this is where they all point. To arrive is to stand at the place where direction itself ends.</p>
  </div>
</section>`,

/* 12 */
`<section class="page plate">
  <img src="/images/nearness-17.jpg?v=2" alt="The Kaaba and the circling crowd in daylight, from the upper level, Grand Mosque, Makkah al-Mukarramah">
</section>`,

/* 14 */
`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">II &nbsp;&middot;&nbsp; The Circling</div>
    <hr class="text-rule">
    <p class="body">The crowd moves around the Kaaba in a slow, constant circle that has not stopped, day or night, for as long as anyone can establish. Seven circuits, anticlockwise, beginning at the black stone. The old, carried. The young, carrying. Individual people enter the circle and are absorbed by it, and from the upper floors the movement looks like water finding its level.</p>
    <p class="body">From within it there is no view at all: only the black cloth ahead, nearer with each turn, and the press of every nation on earth around you, and the words each person brought with them, said under the breath in a hundred languages at once. The tawaf is the only ritual in the faith performed in imitation of the angels, who are described circling the Throne in exactly this way. Whether the pilgrim thinks of that or simply concentrates on keeping their footing, the body learns something the mind takes longer to accept: the centre does not move. You do.</p>
    <p class="body">Nobody times it. Nobody has ever wanted it to end quickly.</p>
  </div>
</section>`,

/* 20 */
`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">II &nbsp;&middot;&nbsp; The Nations</div>
    <hr class="text-rule">
    <p class="body">Sit still in any corridor of the mosque for ten minutes and the whole world passes. Indonesian grandmothers in white, moving in careful convoys. Nigerian men in green, singing quietly. Turkish families, Uzbek scholars, converts from cities that have no mosque, carried here by savings gathered over decades. Nobody checks anyone&rsquo;s passport at prayer. The rows form by arrival time, not by nation, and a millionaire prays shoulder to shoulder with the man who swept the marble an hour earlier.</p>
    <p class="body">This is the other thing the photographs keep finding: not the building but the levelling. The Prophet &#65018; declared it plainly in his final sermon, delivered a few miles from here: no Arab has superiority over a non-Arab, nor white over black, except in righteousness. Two lengths of white cloth were the beginning of it. The prayer rows complete it. The same cloth, worn at the beginning of the journey, will one day be the burial shroud, and every pilgrim knows this is not a coincidence.</p>
    <p class="body">There is no other place on earth where humanity organises itself this way, at this scale, every single day, without anyone directing it.</p>
  </div>
</section>`,

`<section class="page">

    <div class="chapter-ref">III &nbsp;&middot;&nbsp; The Nearness</div>
    <hr class="text-rule">
    <p class="body">There is a moment, somewhere in the circling, when the crowd loosens for a breath and the cloth is suddenly close enough to read. Gold thread on black silk. Verses embroidered by hand, by craftsmen whose names are not on it, in a workshop that has been remaking this cloth every single year for generations, because nothing this near to the centre is permitted to fade.</p>
    <p class="body">This is as near as most people will ever be. Some reach out. Some cannot. Some weep without deciding to, and are held up by strangers who do not ask why, because nobody here needs the reason explained. Nobody photographs well in this moment, and nobody minds, because this was never the point of the journey that a photograph could hold anyway.</p>

`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">IV &nbsp;&middot;&nbsp; The Crossing</div>
    <hr class="text-rule">
    <p class="body">Four hundred and fifty kilometres separate the two sanctuaries. The Prophet &#65018; made this journey once, northward, in flight, hunted by his own city, travelling by night with a single companion and resting in caves. That journey is called the Hijrah, and the Muslim calendar does not begin with his birth or his first revelation. It begins with this road.</p>
    <p class="body">Today a train makes the crossing in two hours. The onboard screen shows the route drawn over the same desert, the speed steady at two hundred and eighty-one kilometres per hour, and the destination written in a font that takes none of it seriously: Madinah. Pilgrims doze. Children negotiate for snacks. The mountains through the window are the same mountains.</p>
    <p class="body">It is worth sitting with the arithmetic. What cost the best man of his generation &#65018; two weeks of fear and thirst now costs an afternoon nap. Nobody on the train has forgotten this. It is, in a quiet way, the entire reason the train exists.</p>

</section>`,

`<section class="page">

    <hr class="text-rule">
    <p class="body">The register changes completely. Makkah is gravity. Madinah is rest. Pilgrims arrive here exhausted and something in the city receives that exhaustion and answers it. Nobody who has made the journey needs this explained, and nobody who has not will quite believe how physical the difference is.</p>
    <p class="body">This is the city that took the Prophet &#65018; in when his own would not. It was called Yathrib then; it has been called al-Madinah al-Munawwarah, the Illuminated City, ever since, and the light in the name is not a metaphor the visitor has to work for. It is there in the late afternoon, on the stone of the plazas, under the great umbrellas that open each morning like a garden blooming on schedule.</p>
    <p class="body">Beneath the green dome lies the man whose city this is &#65018;. The dome has been painted that colour since 1837 and has become, quietly, one of the most recognised silhouettes on earth. The nearness here is different from Makkah&rsquo;s: not a building at the centre of the world, but a person, and the endless, patient, moving line of those who have come simply to say: peace be upon you, O Messenger of God. In person. Having travelled five thousand miles to say it.</p>

`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">V &nbsp;&middot;&nbsp; The Interior</div>
    <hr class="text-rule">
    <p class="body">The interior rewards slowness. The columns are dressed in white marble with gilded collars, and the arches above them alternate dark and pale stone in a rhythm that continues, bay after bay, further than the eye can resolve. Ottoman craftsmen decorated one section, Mamluk hands another, the Saudi expansions added acres more, and somehow the whole thing reads as one continuous room.</p>
    <p class="body">In the oldest section the ceilings drop, the chandeliers age a century at a stride, and the tilework turns Ottoman blue and green. Somewhere within this quarter is the Rawdah, the small garden the Prophet &#65018; described as a garden from the gardens of Paradise, between his house and his pulpit. The queue for it forms before dawn and never entirely disperses.</p>
    <p class="body">People live here during their stay in a way no other great building permits. They read against the columns. They sleep between prayers. They eat dates quietly and share them with strangers. The building has held prayer continuously for fourteen centuries, and it carries that use the way old furniture carries polish: not as wear, but as depth.</p>
  </div>
</section>`,

`<section class="page">

    <hr class="text-rule">
    <p class="body">Before the sunset prayer, plastic sheets unroll down the length of the carpets, and on them appear dates, bread, yoghurt, coffee: thousands of individual meals, laid out by people who will not eat them. Families in Madinah compete for the honour. Some have held the same stretch of carpet for generations, and guard the right to feed strangers there the way other families guard land.</p>
    <p class="body">The guest of the two sanctuaries is considered the guest of God, and Madinah takes the implication personally. A pilgrim can arrive with nothing at the right hour and be fed, insistently, by six different hosts before finding a place to sit. The Prophet &#65018; said that whoever believes in God and the Last Day should honour their guest. His city has treated the instruction as standing orders for fourteen hundred years.</p>
    <p class="body">The photographs of this are ordinary on purpose: rows of seated men, sealed bags, paper cups. Hospitality at this scale does not look like a banquet. It looks like logistics, performed nightly, for no one&rsquo;s credit.</p>

`<section class="page">

    <hr class="text-rule">
    <p class="body">On the southern edge of the city stands the first mosque of them all: Quba, founded by the Prophet &#65018; on his arrival from Makkah, before he had even entered the city that would take his name. He laid its first stones with his own hands. The building has been rebuilt many times since. The significance has not moved an inch.</p>
    <p class="body">He &#65018; used to ride out to Quba every Saturday, and said that prayer in it carries the reward of a lesser pilgrimage. So the pilgrims come as he came, in the late afternoon mostly, and pray briefly, and sit for a while in the shade. It is a lighter place than the great mosques: white and open under a wide sky, green-banded arches inside, the names of the companions set in gold medallions along the vaults, palms at its edges and pigeons working the courtyards.</p>
    <p class="body">At sunset the minarets go to silhouette and a single bird crosses the frame, and for a moment the fourteen centuries between the first mud-brick courtyard and this evening feel very short indeed.</p>

`<section class="page">

    <div class="chapter-ref">VI &nbsp;&middot;&nbsp; Uhud</div>
    <hr class="text-rule">
    <p class="body">North of the city the mountain of Uhud stands red-brown and bare, and at its foot lies the field where the community&rsquo;s hardest day was endured. Seventy of the Prophet&rsquo;s &#65018; companions fell here, among them his uncle Hamzah, and the visit to their resting place is made in near silence, because there is a form of greeting taught for it and very little to add.</p>
    <p class="body">The Prophet &#65018; said of this mountain: Uhud is a mountain that loves us, and we love it. Visitors tend to look up at the rock differently after learning the sentence. Geology is not usually spoken of this way. Here, it is.</p>
    <p class="body">The city has grown to meet the mountain, and around the sites of memory it has built quarters of remembrance: walls where the names of the prophets are cut in light, museums of the Hijrah route, gardens planted where armies once formed. A place this old does not preserve its history behind glass. It continues living in the middle of it.</p>

`<section class="page">

    <div class="chapter-ref">VII &nbsp;&middot;&nbsp; What Stays</div>
    <hr class="text-rule">
    <p class="body">Around the sanctuaries, life continues at its own scale, and it would be dishonest to leave it out. A caf&eacute; under the date palms where the gravel is raked and the chairs are bentwood and the shade does the work air conditioning does everywhere else. A coffee counter where the cups are stacked in patterned sleeves and the machine is the colour of terracotta. The holy cities are also, simply, cities, and their ordinary mornings deserve a page.</p>
    <p class="body">Then there are the objects that make the journey home. Oud wood in a shop drawer, sold by weight. Attar in small bottles, chosen slowly, because the Prophet &#65018; loved perfume and his community has never needed a second reason. A misbaha of pale amber, coiled on a table beside the watches and the pen, with the sanctuary out of focus through the window behind.</p>
    <p class="body">Scent is the pilgrim&rsquo;s photograph: years later, one breath of the right oil returns the entire journey in a way no image manages.</p>

`<section class="page">

    <div class="chapter-ref">VII &nbsp;&middot;&nbsp; The Return</div>
    <hr class="text-rule">
    <p class="body">Leaving is its own ritual. There is a farewell circling in Makkah, named as such in the books, and most people perform it more slowly than they need to. Then the coach, the airport, the ordinary indignities of travel, and somewhere over the sea the white cloth goes back into the suitcase and the pilgrim becomes a passenger again.</p>
    <p class="body">Except not entirely. Ask anyone who has been. Something in the ordering of their days is different afterwards, usually quietly, occasionally completely. The accepted pilgrimage, the tradition says, has no reward except Paradise, and its sign is not in the certificate or the photographs but in the person who returns. The journey continues working long after the return, which is the one thing about it that everyone agrees on and nobody can explain.</p>
    <p class="body">In a night market, a painting of the green dome stands on an easel among modern canvases. Someone who was here tried to hold it too, in oil instead of light. Every pilgrim carries a version home: a painting, a photograph, a scent, a date pressed in a suitcase. None of them are the place. All of them point at it.</p>
  </div>
</section>`,

`<section class="page">
  <div class="textwrap">
    <div class="section-label">Closing Reflection</div>
    <p class="body">This publication set out knowing it would fail, in the way any photograph of these two cities fails. What the pilgrim goes to find is not visible. It does not reflect light. The camera, which knows only light, spends the whole journey documenting the container and never the thing contained.</p>
    <p class="body">And yet the container is worth holding. The gold thread on the black silk. The train crossing the Hijrah road at two hundred and eighty-one kilometres per hour. The umbrellas opening at dawn. The meals laid out nightly by families who will not eat them. The old man asleep against the column, five thousand miles from his front door and entirely at home. These are the edges of something, photographed carefully, in the hope that an edge is enough to suggest the shape of the whole.</p>
    <p class="body">Forty-three photographs of the nearest that most of us will ever be. What was actually near cannot be printed. Those who know, know. This book is for them, and for the ones still intending to go.</p>

const N = PAGES.length;
let cur = 0;
let busy = false;
let cTimer;

const mPanel  = document.getElementById('mobile-panel');
const pLeft   = document.getElementById('panel-left');
const pRight  = document.getElementById('panel-right');
const counter = document.getElementById('counter');
const btnPrev = document.getElementById('btn-prev');
const btnNext = document.getElementById('btn-next');

const isDesk = () => window.innerWidth >= 900;

function inject(el, idx) {
  if (!el) return;
  if (idx < 0 || idx >= N) {
    el.innerHTML = '';
    el.style.background = 'var(--linen)';
    return;
  }
  el.innerHTML = PAGES[idx];
  const pg = el.querySelector('.page');
  const isDark = pg && (pg.classList.contains('plate') || pg.classList.contains('dark-page'));
  el.style.background = isDark ? 'var(--dark)' : 'var(--linen)';
}

function tick(n) {
  counter.textContent = n + ' / ' + N;
  counter.classList.remove('fade');
  counter.classList.add('show');
  clearTimeout(cTimer);
  cTimer = setTimeout(() => counter.classList.add('fade'), 2400);
}

function renderDesk(idx) {
  const left = idx % 2 === 0 ? idx : idx - 1;
  cur = Math.max(0, Math.min(N - 1, left));
  inject(pLeft,  cur);
  inject(pRight, cur + 1 < N ? cur + 1 : -1);
  tick(cur + 1);
}

function renderMobile(idx) {
  cur = Math.max(0, Math.min(N - 1, idx));
  inject(mPanel, cur);
  tick(cur + 1);
}

function slide(dir, newIdx) {
  if (busy) return;
  busy = true;
  const out = mPanel.cloneNode(true);
  out.style.cssText = 'position:absolute;inset:0;z-index:3;';
  document.getElementById('mobile-wrap').appendChild(out);
  inject(mPanel, newIdx);
  cur = newIdx;
  tick(cur + 1);
  const inCls  = dir === 'next' ? 'pg-enter-right' : 'pg-enter-left';
  const outCls = dir === 'next' ? 'pg-exit-left'   : 'pg-exit-right';
  mPanel.style.animation = 'none';
  void mPanel.offsetWidth;
  mPanel.classList.add(inCls);
  out.classList.add(outCls);
  setTimeout(() => {
    out.remove();
    mPanel.classList.remove(inCls);
    busy = false;
  }, 480);
}

function next() {
  if (isDesk()) { renderDesk(cur + 2); }
  else { if (cur < N - 1) slide('next', cur + 1); }
}
function prev() {
  if (isDesk()) { renderDesk(cur - 2); }
  else { if (cur > 0) slide('prev', cur - 1); }
}

function enter() {
  document.getElementById('intro').classList.add('gone');
  setTimeout(() => document.getElementById('hint').classList.add('gone'), 3500);
  if (isDesk()) {
    btnPrev.style.display = btnNext.style.display = 'block';
    renderDesk(0);
  } else {
    renderMobile(0);
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
});

let sx = 0, sy = 0;
document.addEventListener('touchstart', e => {
  sx = e.touches[0].clientX; sy = e.touches[0].clientY;
}, {passive:true});
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  const dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy))
    dx < 0 ? next() : prev();
}, {passive:true});

let wasDesk = isDesk();
window.addEventListener('resize', () => {
  const now = isDesk();
  if (now !== wasDesk) {
    wasDesk = now;
    btnPrev.style.display = btnNext.style.display = now ? 'block' : 'none';
    if (now) renderDesk(cur);
    else renderMobile(cur);
  }
});
</script>
<script>document.addEventListener("contextmenu",function(e){if(e.target&&e.target.tagName==="IMG")e.preventDefault();});document.addEventListener("dragstart",function(e){if(e.target&&e.target.tagName==="IMG")e.preventDefault();});</script>
