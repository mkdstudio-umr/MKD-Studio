`<section class="page">

    <div class="chapter-ref">I &middot; Weather</div>
    <hr class="text-rule">
    <p class="body">It rained. Not the sort of rain that clears an event, but the steady, unhurried kind that settles in over Kent in September and gives no indication of stopping. Umbrellas went up in the car park and stayed up.</p>

/* 019 */
`<section class="page">
  <div class="textwrap">
    <div class="section-label">Opening Note</div>
    <p class="body">We were given the opportunity to sponsor the McLaren Construction Group golf day this year, and we took it gladly.</p>
    <p class="body">Part of the appeal was straightforward. There were people on the sheet we have worked alongside for years, and a golf course is a better place to catch up with them than a site meeting or a phone call. The rest was less obvious. Much of our working relationship with McLaren, like most relationships in this industry, is conducted through drawings, programmes and email. You come to know people well without ever having stood next to them. The day put faces to a good number of those names.</p>
  </div>
</section>`,

/* 020 */
`<section class="page">
  <div class="textwrap">
    <p class="body">We also wanted to bring our own supply chain with us. Press Glass, OTIIMA, RGB, Weldall and Liquid Peel each sponsored one of the prize-winning holes, and their support is a large part of why the day worked as well as it did for us. We do not deliver anything on our own. Nothing we put on a building arrives without them, and it mattered to have them on the same course on the same afternoon rather than at opposite ends of a procurement schedule.</p>
    <p class="body">Our thanks go to McLaren for the invitation and for the way the day was run, to our partners for supporting it, and to everyone who turned out in weather that looked no better at eight in the morning than it did at seven.</p>
    <p class="body">It was a good day. We would do it again.</p>
  </div>
</section>`,

`<section class="page">

    <div class="section-label">Editorial</div>
    <p class="body">Most of the people who make a building never meet.</p>
    <p class="body">A facade is drawn in one place, extruded in another, glazed in a third, and fitted on site by people who arrive after the glass has gone in. What holds that sequence together is a programme written months ahead and revised almost daily, and nearly all of it is conducted at a distance: drawings issued, dates confirmed, queries answered the same afternoon by someone whose face you have never seen.</p>
  </div>
</section>`,

/* 023 */
`<section class="page">
  <div class="textwrap">
    <p class="body">The industry is built this way for sound reasons and it works. But distance carries a cost that only becomes visible on the rare day it is lifted.</p>
    <p class="body">On 17 September it was lifted. McLaren Construction Group organised and hosted. Glaze Aluminium Facades sponsored, and brought five of its own suppliers with it. It rained from the first tee until the turn and everybody got equally wet.</p>
    <p class="body">A supply chain is an abstraction for most of the year, a column of company names in the corner of a drawing. For one Thursday in Kent it had faces, walked four miles, and came in soaked.</p>
  </div>
</section>`,

    <hr class="text-rule">
    <p class="body">The club is older than the ground it plays on.</p>
    <p class="body">Rochester Golf Club was founded in 1891, nine holes at Oakleigh Farm in Higham, later extended to eighteen. In 1919 the land changed hands and the club had nowhere to go. It was rescued by Ivo Bligh, 8th Earl of Darnley, who leased it the Deer Park at Cobham Hall.</p>
    <p class="body">Bligh had captained England in Australia in 1882 and 1883. The urn presented to him on that tour sat on a mantelpiece at Cobham Hall for forty-three years, until he died. The man who found this club its ground kept the Ashes on his shelf.</p>
  </div>
</section>`,

/* 031 */
`<section class="page">
  <div class="textwrap">
    <p class="body">The course was laid out in 1920 by Colt, MacKenzie and Alison, with Charles Alison directing the work. Bernard Darwin, writing in its early years, observed that the golfer here &ldquo;never has the least sensation of being crowded&rdquo;.</p>
    <p class="body">What Alison was given was not raw land. Cobham's parkland had been composed in the late eighteenth century by Humphry Repton, so the golf is a later layer on a landscape that was already designed. The oaks are the evidence. Some are more than six hundred years old, which means they were already standing, and already old, when Repton drew his plan, and older by five centuries than the first tee shot struck across them. Beech, chestnut and hornbeam fill in around them. A seat beside the fifteenth green carries Repton's name.</p>
  </div>
</section>`,

/* 035 */
`<section class="page">
  <div class="textwrap">
    <p class="body">The layout changed once more in the 1990s, when the Channel Tunnel Rail Link was routed through the estate and took the clubhouse and several holes with it. Donald Steel rebuilt seven holes, altered the other eleven and laid eighteen new greens, holding the Colt and Alison character wherever the route allowed. Planning conditions required that whatever was replanted be indigenous hardwood.</p>
    <p class="body">None of this is visible on a Thursday in September. A golf day arrives, plays, and leaves, and the ground takes it the way it has taken everything else.</p>
  </div>
</section>`,

`<section class="page">

    <div class="chapter-ref">III &middot; Familiar Faces</div>
    <hr class="text-rule">
    <p class="body">A good proportion of the people here had met before, some of them many times, across projects that are finished and projects still running. What a golf day offers them is not an introduction but an unhurried hour.</p>
    <p class="body">Site conversations are conducted standing up, in high-vis, with something else waiting. These are conducted walking, over four miles, with long gaps in them. The talk moves from the job to everything else and occasionally back again. These relationships are not maintained in meetings. They are kept up like this, in instalments, a few hours at a time, usually while a game is nominally going on.</p>
  </div>
</section>`,

`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">IV &middot; Around the Course</div>
    <hr class="text-rule">
    <p class="body">What follows is the golf: tee shots, bunkers, the long study of a putt from four feet, and the considerable amount of standing about that holds it all together.</p>
    <p class="body">The photographs alternate deliberately. A ball struck, then a ball walked after. Any honest record of a round is mostly walking.</p>
    <p class="body">It takes about four hours, and the ball is in motion for perhaps two minutes of it. The rest is approach, assessment and the walk to wherever it went. That ratio is exactly why the game suits a day like this one.</p>

/* 098 */
`<section class="page">
  <div class="textwrap">
    <div class="chapter-ref">V &middot; Putting Faces to Names</div>
    <hr class="text-rule">
    <p class="body">There is a particular kind of working relationship that is close without being personal. You know how somebody writes, how quickly they answer, whether their programme dates hold. You would not know them in the street.</p>
    <p class="body">Construction produces a great many of these. The industry runs on them. A day like this one does something small and useful to that arrangement: it attaches a face, a handshake and four hours of ordinary conversation to a name that until then existed at the bottom of an email. None of that changes the project. It changes how the next difficult phone call goes, and anyone who has had to make one will know the difference.</p>
  </div>
</section>`,

    <p class="body">A facade is not a single product. It is glass, frame, fixing, finish and protection, sourced from different companies in different places, arriving in a sequence that has to be right. The names on the banners along the course are the names on that sequence. Seeing them set out across a parkland course, a few hundred yards apart, is a reasonable picture of how the thing is actually assembled.</p>

const btnNext = document.getElementById('btn-next');

const isDesk = () => window.innerWidth >= 900;

const SRC_OF = PAGES.map(p => { const m = p.match(/img src="([^"]+)"/); return m ? m[1] : null; });
const loaded = new Set();
function preloadAround(idx) {
  for (let i = Math.max(0, idx - 2); i <= Math.min(N - 1, idx + 6); i++) {
    const s = SRC_OF[i];
    if (s && !loaded.has(s)) { loaded.add(s); const im = new Image(); im.src = s; }
  }
}

function isSpreadRight(i) { return i >= 0 && i < N && PAGES[i].indexOf('spread-r') !== -1; }

function inject(el, idx) {
  if (!el) return;
  if (idx < 0 || idx >= N) { el.innerHTML = ''; el.style.background = 'var(--linen)'; return; }
  el.innerHTML = PAGES[idx];
  const pg = el.querySelector('.page');
  el.style.background = (pg && pg.classList.contains('plate')) ? 'var(--dark)' : 'var(--linen)';
}

function tick(n) {
  try { localStorage.setItem(KEY, cur); } catch (e) {}
  counter.textContent = n + ' / ' + N;
  counter.classList.remove('fade');
  counter.classList.add('show');
  clearTimeout(cTimer);
  cTimer = setTimeout(() => counter.classList.add('fade'), 2400);
  preloadAround(cur);
}

function renderDesk(idx) {
  const left = idx % 2 === 0 ? idx : idx - 1;
  cur = Math.max(0, Math.min(N - 1, left));
  inject(pLeft, cur);
  inject(pRight, cur + 1 < N ? cur + 1 : -1);
  tick(cur + 1);
}
function renderMobile(idx) {
  cur = Math.max(0, Math.min(N - 1, idx));
  inject(mPanel, cur);
  tick(cur + 1);
}

function slide(dir, newIdx) {
  if (busy) return;
  busy = true;
  const out = mPanel.cloneNode(true);
  out.style.cssText = 'position:absolute;inset:0;z-index:3;';
  document.getElementById('mobile-wrap').appendChild(out);
  inject(mPanel, newIdx);
  cur = newIdx;
  tick(cur + 1);
  const inCls  = dir === 'next' ? 'pg-enter-right' : 'pg-enter-left';
  const outCls = dir === 'next' ? 'pg-exit-left'   : 'pg-exit-right';
  mPanel.style.animation = 'none';
  void mPanel.offsetWidth;
  mPanel.classList.add(inCls);
  out.classList.add(outCls);
  setTimeout(() => { out.remove(); mPanel.classList.remove(inCls); busy = false; }, 480);
}

/* on mobile a spread shows as its left half only, so skip the right half */
function step(from, dir) {
  let i = from;
  while (i > 0 && i < N - 1 && isSpreadRight(i)) i += dir;
  return i;
}

function next() {
  if (isDesk()) renderDesk(cur + 2);
  else if (cur < N - 1) slide('next', step(cur + 1, 1));
}
function prev() {
  if (isDesk()) renderDesk(cur - 2);
  else if (cur > 0) slide('prev', step(cur - 1, -1));
}

function enter(start) {
  start = start || 0;
  document.getElementById('intro').classList.add('gone');
  setTimeout(() => document.getElementById('hint').classList.add('gone'), 3500);
  if (isDesk()) { btnPrev.style.display = btnNext.style.display = 'block'; renderDesk(start); }
  else renderMobile(start);
}

(function () {
  let s = 0;
  try { s = parseInt(localStorage.getItem(KEY), 10) || 0; } catch (e) {}
  if (s > 0 && s < N - 1) {
    const first = document.querySelector('.intro-open');
    if (!first) return;
    const cont = first.cloneNode(false);
    cont.textContent = 'Continue from page ' + (s + 1);
    cont.removeAttribute('onclick');
    cont.onclick = function () { enter(s); };
    cont.style.marginTop = '1rem';
    first.insertAdjacentElement('afterend', cont);
    first.textContent = 'Start from the beginning';
  }
})();

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
  if (e.key === 'ArrowLeft')  { e.preventDefault(); prev(); }
});

let sx = 0, sy = 0;
document.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  const dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) dx < 0 ? next() : prev();
}, {passive:true});

let wasDesk = isDesk();
window.addEventListener('resize', () => {
  const now = isDesk();
  if (now !== wasDesk) {
    wasDesk = now;
    btnPrev.style.display = btnNext.style.display = now ? 'block' : 'none';
    if (now) renderDesk(cur); else renderMobile(cur);
  }
});

preloadAround(0);
</script>
<script>if(/[?&]auto=1/.test(location.search)){enter();}</script>
<script>
(function(){
  function fitPage(pageEl){
    var inner = pageEl.firstElementChild;
    if(!inner || inner.tagName === 'IMG') return;
    inner.style.transform = '';
    inner.style.transformOrigin = 'center center';
    pageEl.style.overflowY = '';
    var natural = inner.scrollHeight;
    var avail = pageEl.clientHeight;
    if (!natural || !avail || natural <= avail) return;
    var scale = 1, tries = 16;
    while (natural * scale > avail && scale > 0.68 && tries-- > 0) {
      scale -= 0.03;
      inner.style.transform = 'scale(' + scale.toFixed(2) + ')';
    }
    if (natural * scale > avail) {
      pageEl.style.overflowY = 'auto';
      pageEl.style.webkitOverflowScrolling = 'touch';
    }
  }
  function checkAll(){
    ['panel-left','panel-right','mobile-panel'].forEach(function(id){
      var host = document.getElementById(id);
      if (!host) return;
      host.querySelectorAll('.page').forEach(fitPage);
    });
  }
  var mo = new MutationObserver(function(){ requestAnimationFrame(checkAll); });
  ['panel-left','panel-right','mobile-panel'].forEach(function(id){
    var host = document.getElementById(id);
    if (host) mo.observe(host, {childList:true, subtree:true});
  });
  window.addEventListener('resize', checkAll);
  window.addEventListener('orientationchange', function(){ setTimeout(checkAll, 300); });
})();
</script>
</body>
